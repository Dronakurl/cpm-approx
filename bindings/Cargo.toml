[package]
name = "cpm-approx-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Python bindings of cpm-approx"

# Separate build root: built by maturin through ../pyproject.toml, not part of any other workspace.
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cpm-approx = { path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }

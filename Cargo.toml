[package]
name = "cpm-approx"
version = "0.1.0"
edition = "2021"
description = "Analytical VaR and expected shortfall of credit portfolios in the multi-factor Merton model (multi-factor adjustment, Risk 2004)"
license = "MIT"
repository = "https://github.com/Dronakurl/cpm-approx"
readme = "README.md"
keywords = ["credit-risk", "value-at-risk", "expected-shortfall", "merton", "portfolio"]
categories = ["mathematics", "finance"]

[lib]
name = "cpm_approx"
path = "src/lib.rs"

[[bin]]
name = "cpm-approx"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statrs = "0.19"

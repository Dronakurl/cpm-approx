[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cpm-approx"
version = "0.1.0"
description = "Analytical VaR and expected shortfall of credit portfolios in the multi-factor Merton model (multi-factor adjustment, Risk 2004)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dronakurl" }]
keywords = ["credit risk", "value at risk", "expected shortfall", "merton model", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Dronakurl/cpm-approx"

[dependency-groups]
dev = ["pytest>=8", "numpy>=2"]

[tool.maturin]
manifest-path = "bindings/Cargo.toml"
python-source = "pysrc"
module-name = "cpm_approx._native"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
